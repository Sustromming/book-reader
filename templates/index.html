<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPUB Reader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <div class="fab-group">
    <button id="new-book" class="settings-fab" type="button" aria-label="Load new book" hidden>
      New book
    </button>
    <button id="settings-open" class="settings-fab" type="button" aria-label="Open settings"
            aria-haspopup="dialog" aria-controls="settings-dialog" aria-expanded="false">
      Settings
    </button>
  </div>

  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog" class="settings-form">
      <div class="settings-header">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-close" class="settings-close" type="submit" aria-label="Close settings">&times;</button>
      </div>

      <div class="setting-row">
        <label for="theme-select">Theme</label>
        <select id="theme-select" class="control">
          <option value="light">Light</option>
          <option value="sepia">Sepia</option>
          <option value="dark">Dark</option>
          <option value="black">Black (AMOLED)</option>
          <option value="nord">Nord</option>
          <option value="dracula">Dracula</option>
          <option value="gruvbox-dark">Gruvbox Dark</option>
          <option value="catppuccin-dark">Catppuccin Dark</option>
          <option value="solarized-dark">Solarized Dark</option>
          <option value="system">System (auto)</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="brightness">Brightness</label>
        <div class="size-control">
          <input id="brightness" type="range" min="50" max="150" step="1" />
          <span id="brightness-value" class="size-value">100%</span>
        </div>
      </div>

      <div class="setting-row">
        <label for="contrast">Contrast</label>
        <div class="size-control">
          <input id="contrast" type="range" min="50" max="150" step="1" />
          <span id="contrast-value" class="size-value">100%</span>
        </div>
      </div>

      <div class="setting-row">
        <label for="sepia">Sepia</label>
        <div class="size-control">
          <input id="sepia" type="range" min="0" max="100" step="1" />
          <span id="sepia-value" class="size-value">0%</span>
        </div>
      </div>

      <div class="setting-row">
        <label for="grayscale">Grayscale</label>
        <div class="size-control">
          <input id="grayscale" type="range" min="0" max="100" step="1" />
          <span id="grayscale-value" class="size-value">0%</span>
        </div>
      </div>

      <div class="setting-row">
        <label for="font-family">Font</label>
        <select id="font-family" class="control">
          <option value="serif">Serif</option>
          <option value="sans">Sans</option>
          <option value="mono">Mono</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="font-size">Size</label>
        <div class="size-control">
          <input id="font-size" type="range" min="10" max="26" step="1" />
          <span id="font-size-value" class="size-value">17px</span>
        </div>
      </div>

      <div class="setting-row">
        <label for="reader-width">Width</label>
        <div class="size-control">
          <input id="reader-width" type="range" min="520" max="1100" step="10" />
          <span id="reader-width-value" class="size-value">760px</span>
        </div>
      </div>
    </form>
  </dialog>

  <main class="layout">
    <section id="dropzone" class="dropzone" data-upload-url="{{ url_for('upload_epub') }}" aria-labelledby="upload-title">
      <h1 id="upload-title">Open a book</h1>
      <p><strong>Drag and drop your .epub here</strong></p>
      <p>or</p>
      <button id="choose-book" class="file-btn" type="button">Choose file</button>
      <input id="epub-input" class="visually-hidden" type="file" accept=".epub" aria-label="EPUB file" />
    </section>
    <p id="status" class="status" role="status" aria-live="polite">Waiting for file...</p>

    <header class="book-header" id="book-header" hidden>
      <h1 class="book-title" id="book-title" tabindex="-1"></h1>
    </header>

    <article id="reader" class="reader" aria-label="Book content"></article>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}" type="module" defer></script>
</body>
</html>
